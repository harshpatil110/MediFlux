[package]
name = "mediflux-desktop"
version = "1.0.0"
description = "MediFlux Autonomous Supply Chain Desktop Control Tower"
authors = ["MediFlux Engineering <dev@mediflux.in>"]
license = "Proprietary"
repository = "https://github.com/harshpatil110/MediFlux"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "notification-all", "shell-open", "http-all", "window-all" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

